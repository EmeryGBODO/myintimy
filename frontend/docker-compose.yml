services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myintimy
      POSTGRES_USER: myintimy
      POSTGRES_PASSWORD: myintimy
    ports:
      - "5432:5432"
    volumes:
      - myintimy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myintimy -d myintimy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  myintimy_postgres_data:
